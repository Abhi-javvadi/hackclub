<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Phoenix Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<link rel="stylesheet" href="style.css?v=51">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="hud" hidden>
    <div class="hud-left">
      <div class="stat"><span class="label">SCORE</span><b id="hud-score">0</b></div>
      <div class="stat small"><span class="label">COINS</span><b id="hud-embers">0</b></div>
      <div id="hud-lives"><span class="heart"></span><span class="heart"></span><span class="heart"></span><span class="heart"></span><span class="heart"></span></div>
    </div>
    <div class="hud-center">
      <div id="timer-bar"><div id="timer-fill"></div></div>
      <div id="hud-time">90</div>
    </div>
    <div class="hud-right">
      <div class="stat"><span class="label">REBIRTHS</span><b id="hud-rebirths">0</b></div>
    </div>
  </div>

  <div id="title" class="screen">
    <div class="panel">
      <div class="logo">PHOENIX RUN</div>
      <table class="keys">
        <tr><td>W / ↑</td><td>rise</td></tr>
        <tr><td>S / ↓</td><td>dive</td></tr>
      </table>
      <div class="credit">Art: Chasersgaming, Admurin, Game Developer Studio, CraftPix, TotusLotus, AXIALE, Vinzes, NYKNCK.<br>Fonts: Silkscreen by Jason Kottke, VT323 by Peter Hull.</div>
    </div>
  </div>

  <div id="results" class="screen" hidden>
    <div class="panel">
      <div id="res-heading" class="logo small">TIME'S UP</div>
      <div class="final"><span id="res-score">0</span><span id="res-best" class="best"></span></div>
      <table class="stats">
        <tr><td>Coins</td><td id="res-embers">0</td></tr>
        <tr><td>Best streak</td><td id="res-streak">0</td></tr>
      </table>
      <button id="again-btn" class="go">PLAY AGAIN</button>
    </div>
  </div>

  <div id="paused" class="screen" hidden>
    <div class="logo small">PAUSED</div>
    <div class="muted">Press P to resume</div>
  </div>
</div>
<script src="game.js?v=51"></script>
</body>
</html>
